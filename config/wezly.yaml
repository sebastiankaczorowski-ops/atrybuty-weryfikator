# Filtry według węzłów drzewa kategorii panelu. Generowany komendą
# `pipeline filtry-z-macierzy <xlsx>` — nie edytuj ręcznie węzłów;
# zmieniaj arkusz i wczytaj ponownie. `aliasy_typow` wolno edytować.
meta:
  zrodlo: macierz.xlsx
  wczytano: '2026-10-13'
  opis: arkusz Macierz filtrów per kategoria (Ewa Swebocka)
aliasy_typow:
  Kuchnie: Szafki kuchenne
  Stelaże: Stelaże do łóżek
aliasy_par:
  Kuchnie / Blaty: Blaty kuchenne
  Kuchnie / Akcesoria: null
  Kuchnie / Uchwyty: null
  Kuchnie / Fronty Do Zabudowy Podblatowej: null
  Szafki łazienkowe / Zestawy mebli łazienkowych: Zestawy mebli łazienkowych
definicje:
  Na nóżkach: 'TAK: korpus stoi nad podłogą na wyraźnych nóżkach wyższych niż ok. 3 cm, które są osobnym elementem
    (dokręcone/doklejone do korpusu, zwykle z innego materiału niż korpus, np. metal, drewno lite) – pod meblem
    widać wyraźny prześwit. Kształt nóżek nie ma znaczenia: pojedyncze nóżki, płozy, ramki w kształcie U lub prostokąta
    pod korpusem – wszystkie to TAK. TAK także: mebel na stelażu/ramie (np. metalowa rama, w którą wstawiony jest
    korpus lub półki) – pionowe elementy stelaża to nóżki. NIE: stopki i ślizgacze do ok. 3 cm (nóżka nie jest wyraźnie
    wyższa niż grubość blatu/wieńca); „nóżki” będące przedłużeniem boków korpusu z tej samej płyty (boki schodzą
    do podłogi, nawet jeśli pod dnem jest prześwit); łóżko, którego wezgłowie i/lub zanóżek schodzą do podłogi i
    na nich opiera się rama – płyta wezgłowia/zanóżka to nie nóżki, także gdy pod nią są małe stopki, a pod ramą
    widać prześwit; cokół lub korpus do samej podłogi; mebel wiszący; kółka. Wysokość do ziemi ≤3 cm = NIE (większa
    wartość sama nie przesądza o TAK – prześwit dają też przedłużone boki, wezgłowia i zanóżki). NIE WIDAĆ: zdjęcie
    ucina dół mebla, widać tylko detal albo nie da się ocenić, czym jest podparcie.'
  Kształt blatu: 'Kształt blatu widzianego z góry: prostokątny, kwadratowy, okrągły, owalny albo inny (np. nieregularny,
    organiczny). Kwadratowy = boki równe lub prawie równe; owalny = wydłużony z zaokrąglonymi końcami. Ścięte lub
    lekko zaokrąglone narożniki nie zmieniają kształtu (prostokąt z zaokrąglonymi rogami = prostokątny). Przy stole
    rozkładanym oceniamy blat złożony. Gdy jest kilka blatów (np. zestaw stolików) – kształt blatu głównego. NIE
    WIDAĆ: zdjęcie pod kątem, na którym nie da się odróżnić okrągłego od owalnego albo kwadratu od prostokąta.'
  Oświetlenie: 'Czy mebel ma oświetlenie zamontowane w meblu (LED w witrynie, listwy, podświetlenie półek, wnętrza
    szafy, wezgłowia, lampki do czytania w wezgłowiu, podświetlenie lustra). Wartości: „w zestawie” – oświetlenie
    jest w komplecie i w cenie; „opcjonalne” – można je dokupić osobno (niezależnie od tego, czy jest pokazane na
    zdjęciu); „brak” – mebel nie ma i nie przewiduje oświetlenia. NIE jest oświetleniem: lampa lub światło w aranżacji
    obok mebla, odbicia i refleksy, lustro bez podświetlenia, gniazdka, porty USB, ładowarki indukcyjne. O „w zestawie”
    vs „opcjonalne” rozstrzyga opis / cennik, nie zdjęcie. Dla zdjęcia (Gemini): widoczne zapalone światło, diody
    lub listwy LED w meblu = mebel ma oświetlenie (w zestawie albo opcjonalne – do potwierdzenia w opisie); brak
    widocznego oświetlenia nie oznacza „brak” (zgaszone LED pod wieńcem zwykle nie są widoczne). NIE WIDAĆ: zdjęcie
    bez zapalonego światła, na którym nie widać listew, diod ani przewodów.'
  Liczba drzwi: 'Liczba skrzydeł drzwiowych w meblu: drzwi uchylne, przesuwne, szklane, lustrzane oraz klapy (uchylne
    w górę lub w dół) – każda klapa liczy się jako drzwi. Wartości: „bez drzwi” (brak drzwi i klap), „1-drzwiowe”,
    „2-drzwiowe”, „3-drzwiowe”, „wielodrzwiowe” (4 i więcej). Liczymy skrzydła otwierane jako całość = 1: front
    podzielony frezem lub złożony z dwóch paneli z jednym uchwytem = 1; drzwi łamane w szafce narożnej (dwa panele
    na zawiasie, otwierane razem) = 1; drzwi harmonijkowe (składane) na jednym mocowaniu = 1. Nie liczymy szuflad,
    otwartych wnęk ani maskownic. W zestawie sprzedawanym jako jeden produkt (jedno ID) sumujemy drzwi wszystkich
    elementów. Wskazówka do zdjęcia: szuflada ma zwykle szczelinę i prowadnice, klapa – zawiasy u dołu lub u góry
    frontu; gdy nie da się odróżnić klapy od frontu szuflady – nie zgadujemy. NIE WIDAĆ: część frontu jest zasłonięta,
    ucięta, zdjęcie pokazuje tylko detal albo nie da się odróżnić klapy od szuflady.'
  Liczba szuflad: 'Liczba szuflad w meblu = liczba wysunięć: szuflady zewnętrzne (widoczne z frontu) oraz wewnętrzne
    (za drzwiami, np. w szafie) – pod warunkiem, że są w zestawie i w cenie, a nie dokupowane osobno. Wartości:
    „bez szuflad”, „1-szuflada”, „2-szuflady”, „3-szuflady”, „4 i więcej”. W zestawie sprzedawanym jako jeden produkt
    (jedno ID) sumujemy szuflady wszystkich elementów – także szufladę pod łóżkiem, jeśli łóżko jest częścią zestawu
    mebli. Decyduje liczba wysunięć, nie frontów: front udający dwie szuflady (jeden uchwyt, jedno wysunięcie) =
    1; szuflada podwójna (dwa fronty, jedno wysunięcie) = 1. Nie liczymy klap ani drzwi. Szuflady pod łóżkami i
    kanapami sprzedawanymi osobno nie są liczone (filtr nie jest przypisany do Łóżek i materacy ani mebli wypoczynkowych;
    pojemnik na pościel to filtr Z pojemnikiem). NIE WIDAĆ: mebel ma zamknięte drzwi i nie widać jego wnętrza (mogą
    tam być szuflady wewnętrzne).'
  Liczba półek: 'Liczba półek w meblu. Półka to luźny element montowany na końcu – wkładany do gotowego korpusu
    (zwykle na kołkach, podpórkach lub prowadnicach, często przestawny), z płyty, szkła lub metalu, na którym można
    coś postawić. Liczymy półki wewnętrzne (za drzwiami) i otwarte – tylko te w zestawie i w cenie, nie dokupowane
    osobno. Zestaw sprzedawany jako jeden produkt (jedno ID) – sumujemy półki wszystkich elementów. NIE liczymy
    elementów konstrukcji korpusu, ramy ani frontu: blatu wierzchniego, górnego wieńca, dna korpusu (także gdy jest
    dnem otwartej wnęki), stałych przegród poziomych łączących boki, przegród pionowych, dna szuflad, półek i półeczek
    na wewnętrznej stronie drzwi; w meblu na stelażu, ramie lub nogach – blatu, wierzchu korpusu/skrzynki szuflady
    ani dna korpusu wstawionego w ramę (otwarta przestrzeń między blatem a korpusem to nie półka). Źródło rozstrzygające:
    instrukcja montażu / rysunek techniczny producenta (półki to wolne płyty montowane na końcu, np. na kołkach;
    elementy konstrukcji są skręcane z bokami i trzymają korpus). Po samym zdjęciu często nie da się tego odróżnić
    – wolna półka i płyta konstrukcyjna wyglądają tak samo. Przykłady „bez półek”: szafka RTV z otwartymi wnękami
    nad szufladami/drzwiami rozdzielonymi przegrodami pionowymi; szafka RTV na metalowej ramie ze szklanym blatem
    i korpusem z wnękami; szafka nocna na drewnianej ramie z blatem i szufladą pod nim. Przykład „4” (wg rysunku
    technicznego): wysoki regał z wnękami i przegrodami pionowymi u góry i szafką z drzwiami na dole – 4 poziome
    płyty między wieńcem a dnem są wolnymi półkami (na rysunku elementy 6–9), więc 4; przegrody pionowe się nie
    liczą. Porównaj: w szafce RTV płyta między wnękami a szufladami jest częścią konstrukcji, więc się nie liczy.
    Brak półek = wartość „bez półek”. NIE WIDAĆ: wnętrze jest zamknięte drzwiami lub zasłonięte albo nie da się
    odróżnić półki luźnej od stałej przegrody.'
  Liczba drążków: 'Liczba drążków na wieszaki (ubrania) w szafie lub garderobie (także garderobie do przedpokoju,
    która może mieć szafę) – tylko te, które są w zestawie i w cenie, a nie dokupowane osobno. Zestaw sprzedawany
    jako jeden produkt (jedno ID) – sumujemy drążki wszystkich elementów. Wysuwany drążek i pantograf liczą się
    jako drążek. Nie liczymy relingów, haczyków ani wieszaków na ręczniki. Wartości: „brak drążków”, „1 drążek”,
    „2 drążki”, „3 drążki”, „4 i więcej drążków”. Filtr nie dotyczy wieszaków na ubrania (ściennych, stojących,
    na kółkach) – poprzeczka wieszaka to nie drążek w rozumieniu filtra. NIE WIDAĆ: szafa jest zamknięta i nie widać
    wnętrza.'
