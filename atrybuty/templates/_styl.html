<style>
:root{
  --bg:#f6f8f7; --surface:#fff; --surface-2:#edf1ef;
  --ink:#15201d; --ink-2:#3c4c47; --muted:#6b7c76;
  --line:#d9e1dd; --line-strong:#b9c7c1;
  --accent:#0e5e52; --accent-soft:#d7e8e3;
  --crit:#9a2b2b; --crit-soft:#f5dedc;
  --warn:#8a5a0b; --warn-soft:#f6e7cc;
  --ok:#3a6b2e; --ok-soft:#dfebd6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:14px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
code{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.9em}
a{color:var(--accent)}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;
       display:flex;flex-wrap:wrap;gap:18px;align-items:baseline}
header h1{font-size:16px;margin:0;font-weight:600}
header nav{margin-left:auto;display:flex;gap:14px;font-size:13.5px}
main{padding:18px 20px 70px;max-width:1280px;margin:0 auto;display:flex;
     flex-direction:column;gap:26px}
h2{font-size:15px;margin:0 0 2px;font-weight:600}
.pod{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:75ch}
.komunikat{padding:9px 13px;border-radius:3px;font-size:13.5px}
.komunikat.ok{background:var(--ok-soft);color:var(--ok)}
.komunikat.zle{background:var(--crit-soft);color:var(--crit)}
table{width:100%;border-collapse:collapse;background:var(--surface);
      border:1px solid var(--line);border-radius:3px;overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
         background:var(--surface-2);font-weight:600}
tbody tr:last-child td{border-bottom:none}
tr.nieaktywna td{opacity:.5}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;
     white-space:nowrap}
.sev{display:inline-block;padding:1px 7px;border-radius:2px;font-size:11px;font-weight:600}
.sev.krytyczna{background:var(--crit-soft);color:var(--crit)}
.sev.srednia{background:var(--warn-soft);color:var(--warn)}
.sev.info{background:var(--surface-2);color:var(--muted)}
.zrodlo{font-size:11.5px;color:var(--muted)}
.szcz{color:var(--muted);font-size:12.5px;margin-top:3px}
.skut{font-weight:600}
.skut.dobra{color:var(--ok)} .skut.slaba{color:var(--crit)} .skut.brak{color:var(--muted);font-weight:400}
button{font:inherit;padding:4px 10px;border:1px solid var(--line-strong);border-radius:2px;
       background:var(--bg);color:var(--ink-2);cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.mini{padding:2px 8px;font-size:12px}
form.inline{display:inline}
.dodaj{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px 18px}
.dodaj h3{margin:0 0 4px;font-size:14px}
.pola{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px}
.pole{display:flex;flex-direction:column;gap:3px}
.pole label{font-size:11.5px;color:var(--muted)}
input[type=text],select{font:inherit;padding:5px 8px;border:1px solid var(--line-strong);
       border-radius:2px;background:var(--bg);color:var(--ink);min-width:150px}
details{background:var(--surface);border:1px solid var(--line);border-radius:3px}
details>summary{padding:12px 16px;cursor:pointer;font-weight:600;font-size:14px}
details[open]>summary{border-bottom:1px solid var(--line)}
details .tresc{padding:16px 18px}
.plik{color:var(--muted);font-size:12.5px}
@media(max-width:720px){ .kol-szt,.kol-warstwa{display:none} }
</style>
