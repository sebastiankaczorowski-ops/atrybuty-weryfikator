services:
  atrybuty:
    build: .
    container_name: atrybuty-weryfikator
    restart: unless-stopped
    env_file: .env
    ports:
      # Widoczne w sieci biurowej: http://<IP-Mac-Mini>:8084
      # Gdybyś chciał zamknąć to do samego hosta (i wystawiać przez Tailscale),
      # zmień na "127.0.0.1:8084:8084".
      - "8084:8084"
    volumes:
      # Reguły i słowniki: edytowane z UI (/reguly) i wersjonowane w repo,
      # więc muszą przeżyć restart kontenera i być widoczne na hoście.
      - ./config:/app/config
      # Wgrywane eksporty, pliki poprawek, cache zdjęć.
      - ./dane:/app/dane
      # Baza w nazwanym wolumenie — bind mount z macOS nie daje SQLite
      # blokad plikowych i kończy się "disk I/O error".
      - atrybuty-baza:/app/baza
      # Klucz konta serwisowego z manager-dashboard — sam plik, nie cały
      # katalog secrets/: panel stoi w LAN-ie bez logowania, więc kontener
      # nie powinien widzieć sekretów, których nie używa. Ścieżka w .env.
      - ${KLUCZ_GOOGLE:?ustaw KLUCZ_GOOGLE w .env — patrz WDROZENIE.md}:/app/klucz-google.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/klucz-google.json
volumes:
  atrybuty-baza:
