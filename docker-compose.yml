services:
  atrybuty:
    build: .
    container_name: atrybuty-weryfikator
    restart: unless-stopped
    env_file: .env
    ports:
      # Tylko localhost hosta — na zewnątrz wystawiamy przez Tailscale
      # (tailscale serve --bg 8084), tak jak manager-dashboard na 8082.
      - "127.0.0.1:8084:8084"
    volumes:
      # Reguły i słowniki: edytowane z UI (/reguly) i wersjonowane w repo,
      # więc muszą przeżyć restart kontenera i być widoczne na hoście.
      - ./config:/app/config
      # Wgrywane eksporty, pliki poprawek, cache zdjęć.
      - ./dane:/app/dane
      # Baza w nazwanym wolumenie — bind mount z macOS nie daje SQLite
      # blokad plikowych i kończy się "disk I/O error".
      - atrybuty-baza:/app/baza
volumes:
  atrybuty-baza:
